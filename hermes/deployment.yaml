apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  labels: {app.kubernetes.io/name: hermes}
spec:
  replicas: 1
  strategy:
    type: Recreate # single ReadWriteOnce volume: never run two pods at once
  selector:
    matchLabels: {app.kubernetes.io/name: hermes}
  template:
    metadata:
      labels: {app.kubernetes.io/name: hermes}
    spec:
      securityContext:
        fsGroup: 10000 # the image's hermes user is UID/GID 10000
      initContainers:
        - name: seed-config
          image: busybox:1.36
          command: [sh, -c, "cp /config/config.yaml /opt/data/config.yaml && chown 10000:10000 /opt/data/config.yaml"]
          volumeMounts:
            - {name: data, mountPath: /opt/data}
            - {name: config, mountPath: /config}
      containers:
        - name: hermes
          # Image starts as root (s6-overlay) and drops to UID 10000: don't set runAsNonRoot
          image: nousresearch/hermes-agent:v0.23.3
          args: [gateway, run]
          envFrom:
            - secretRef: {name: hermes-env} # LITELLM_API_KEY, API_SERVER_KEY
          env:
            - {name: API_SERVER_ENABLED, value: "true"}
            - {name: API_SERVER_HOST, value: 0.0.0.0}
            - {name: API_SERVER_PORT, value: "8642"}
          ports:
            - {name: api, containerPort: 8642}
          readinessProbe:
            tcpSocket: {port: api}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 4Gi}
          volumeMounts:
            - {name: data, mountPath: /opt/data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: hermes-data}
        - name: config
          configMap: {name: hermes-config}
