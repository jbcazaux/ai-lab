apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: n8n-db
  namespace: n8n
spec:
  instances: 1
  storage:
    size: 2Gi
  # CNPG creates the n8n database and owner, and stores the credentials in the
  # n8n-db-app Secret (keys: username, password, host, port, dbname, uri)
  bootstrap:
    initdb:
      database: n8n
      owner: n8n
