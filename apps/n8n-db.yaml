apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: n8n-db
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: ai-lab
  source:
    repoURL: https://github.com/jbcazaux/ai-lab.git
    targetRevision: main
    path: n8n/db
  destination:
    server: https://kubernetes.default.svc
    namespace: n8n
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    # SkipDryRun: the CNPG Cluster CRD may not exist yet on a fresh bootstrap
    syncOptions: [CreateNamespace=true, SkipDryRunOnMissingResource=true]
    retry: {limit: 5, backoff: {duration: 10s, factor: 2, maxDuration: 3m}}
