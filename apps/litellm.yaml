apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: ghcr.io/berriai
      chart: litellm-helm
      targetRevision: "1.110.1"
      helm:
        valueFiles:
          - $values/litellm/values.yaml
    - repoURL: https://github.com/jbcazaux/ai-lab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: litellm
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
