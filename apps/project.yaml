apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ai-lab
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  # Blocks deleting the project while Applications still reference it
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  description: AI lab platform and applications
  sourceRepos:
    - https://github.com/jbcazaux/ai-lab.git
    - https://cloudnative-pg.github.io/charts
    - ghcr.io/berriai
  destinations:
    - {server: https://kubernetes.default.svc, namespace: cnpg-system}
    - {server: https://kubernetes.default.svc, namespace: litellm}
    - {server: https://kubernetes.default.svc, namespace: hermes}
    - {server: https://kubernetes.default.svc, namespace: n8n}
  # Cluster-scoped kinds: Namespace for CreateNamespace=true, the rest for the CNPG operator
  clusterResourceWhitelist:
    - {group: "", kind: Namespace}
    - {group: apiextensions.k8s.io, kind: CustomResourceDefinition}
    - {group: rbac.authorization.k8s.io, kind: ClusterRole}
    - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}
    - {group: admissionregistration.k8s.io, kind: MutatingWebhookConfiguration}
    - {group: admissionregistration.k8s.io, kind: ValidatingWebhookConfiguration}
